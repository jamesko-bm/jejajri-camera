<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="책장 사진을 한 장 찍으면 청구기호를 읽고, 잘못 꽂힌 번호에 노란색 상자를 그립니다.">
<meta name="theme-color" content="#10231d"><title>제자리 · 카메라</title>
<link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script>
</head>
<body>
<main class="camera-app" aria-label="제자리 책장 사진 확인">
  <div class="camera-stage" id="stage">
    <video id="camera" autoplay muted playsinline aria-label="사진 찍는 화면"></video>
    <canvas id="overlay" hidden aria-hidden="true"></canvas>
  </div>
  <header><span class="brand">▥ 제자리</span><span class="live-label">카메라</span></header>
  <p id="processing" class="processing" hidden role="status" aria-live="polite">[처리 중]</p>
  <div id="error" class="error" role="alert" hidden><h1 id="error-title">카메라 연결이 필요합니다</h1><p id="error-detail"></p><button id="retry" type="button">카메라 다시 연결</button></div>
  <footer>
    <p id="hint">카메라 사용을 허용해 주세요.</p>
    <button id="read-shelf" type="button" disabled>책장 읽기</button>
    <span>한 장씩 확인합니다 · 영상은 저장·전송하지 않습니다</span>
  </footer>
</main>
</body></html>
