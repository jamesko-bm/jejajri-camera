<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="카메라로 책장을 비추면 청구기호를 자동으로 확인하고, 순서가 감소하기 직전의 책에 노란 테두리를 표시합니다.">
<meta name="theme-color" content="#10231d"><title>제자리 · 카메라</title>
<link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script>
</head>
<body>
<main class="camera-app" aria-label="제자리 실시간 책장 확인">
  <div class="camera-stage" id="stage">
    <video id="camera" autoplay muted playsinline aria-label="실시간 카메라 화면"></video>
    <canvas id="overlay" aria-label="순서가 감소하기 직전의 책을 표시하는 노란 테두리"></canvas>
  </div>
  <header><span class="brand">▥ 제자리</span><span class="live-label">카메라</span></header>
  <div id="notice" class="notice checking" role="status" aria-live="polite">
    <ol class="steps" id="steps">
      <li class="step active" data-step="read"><span>읽음</span></li>
      <li class="step" data-step="interpret"><span>해석 중</span></li>
      <li class="step" data-step="done"><span>완료</span></li>
    </ol>
    <p id="outcome" class="outcome" hidden>정상 배치</p>
    <p id="status-text" class="status-text" hidden></p>
  </div>
  <ol id="readings" class="readings" hidden></ol>
  <div id="error" class="error" role="alert" hidden><h1 id="error-title">카메라 연결이 필요합니다</h1><p id="error-detail"></p><button id="retry" type="button">카메라 다시 연결</button></div>
  <footer><p id="hint">카메라 사용을 허용해 주세요.</p><span>한 단씩 비춰 주세요 · 영상은 저장·전송하지 않습니다</span></footer>
</main>
</body></html>
